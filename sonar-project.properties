# Chave e nome do projeto — devem bater com o que você criou no SonarQube local (localhost:9000)
sonar.projectKey=tempus
sonar.projectName=Tempus
sonar.projectVersion=1.0

# Servidor local (não usar sonar.organization — isso é exclusivo do SonarCloud)
sonar.host.url=http://localhost:9000

# Código-fonte analisado
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests

# Python
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml

# Frontend / JavaScript / TypeScript
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusões (gerados, migrações, node_modules, etc.)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/alembic/**,\
  **/htmlcov/**,\
  **/*.min.js

sonar.cpd.exclusions=**/migrations/**
