# Configuracao do scanner SonarQube para o Tempus.
# Lido por `sonar-scanner` (ou container `sonarsource/sonar-scanner-cli`).
# Token de autenticacao NAO vai aqui — passe via env SONAR_TOKEN no comando.

sonar.projectKey=tempus
sonar.projectName=Tempus
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Onde o servidor esta. Quando o scanner roda dentro de um container Docker
# no Windows/Mac, "localhost" do scanner aponta pra dentro dele mesmo —
# nesse caso passe `-Dsonar.host.url=http://host.docker.internal:9000`
# no comando, sobrescrevendo este default.
sonar.host.url=http://localhost:9000

# ----------------------------------------------------------------------------
# Sources e testes
# ----------------------------------------------------------------------------
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests

# Versoes de Python aceitas para analise de regras especificas.
sonar.python.version=3.11,3.12,3.13

# ----------------------------------------------------------------------------
# Exclusoes (nao entram na analise)
# ----------------------------------------------------------------------------
# - types.ts e gerado por openapi-typescript, nao vale revisar
# - mockServiceWorker.js e injetado pelo `msw init`, codigo de terceiros
sonar.exclusions=\
  **/node_modules/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.vite/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  frontend/src/lib/api/types.ts,\
  frontend/public/mockServiceWorker.js

# ----------------------------------------------------------------------------
# Cobertura
# ----------------------------------------------------------------------------
# Os arquivos abaixo NAO precisam existir no primeiro scan — Sonar so avisa
# que cobertura ficou em 0 e segue. Para popular, rode antes:
#   backend:  pytest --cov=app --cov-report=xml:coverage.xml
#   frontend: npx vitest run --coverage  (gera coverage/lcov.info)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# ----------------------------------------------------------------------------
# Exclusoes de cobertura (estrategia de testes em camadas — ver docs/sonar/README.md)
# ----------------------------------------------------------------------------
# Arquivos abaixo SAO analisados pelo Sonar quanto a bugs, code smells e
# vulnerabilidades, mas NAO contam para o % de cobertura unitaria — porque
# sao testados em outra camada (Playwright E2E ou tipo-checking) e nao por
# unit tests do Vitest.
#
# Justificativa por padrao:
#
#   main.tsx / routes.tsx
#     Bootstrap e configuracao de roteamento — executam 1x na inicializacao,
#     cobertos integralmente pela suite E2E que carrega a app de verdade.
#
#   features/auth/pages/EmailConfirmPage.tsx
#     Tela que processa token de email da URL — testada manualmente e via
#     fluxo integrado de mudanca de email (tests/integration_real do backend).
#
#   features/auth/components/ProfileModal.tsx
#     Modal de perfil com fluxo multi-step (perfil + senha + email + delete).
#     Coberto por integration tests do backend nos endpoints /auth/me e
#     /auth/password.
#
#   features/chat/index.tsx + components
#     Tela e widgets do chat sao cobertos pela suite E2E em
#     frontend/tests/e2e/chat.spec.ts, que roda contra MSW handlers e exercita
#     o fluxo completo de envio/recebimento de mensagem com citacoes.
#
#   lib/auth/RequireAuth.tsx
#     Gateway de rota — exercitada indiretamente por toda navegacao autenticada
#     na suite E2E (auth.spec.ts, subjects.spec.ts, timer.spec.ts, chat.spec.ts).
sonar.coverage.exclusions=\
  frontend/src/main.tsx,\
  frontend/src/routes.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/src/features/auth/pages/EmailConfirmPage.tsx,\
  frontend/src/features/auth/components/ProfileModal.tsx,\
  frontend/src/features/chat/index.tsx,\
  frontend/src/features/chat/components/**,\
  frontend/src/lib/auth/RequireAuth.tsx
