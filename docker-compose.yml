services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tempus
      POSTGRES_PASSWORD: tempus
      POSTGRES_DB: tempus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempus -d tempus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve o DATABASE_URL do .env para apontar para o serviço 'db' do compose
      DATABASE_URL: postgresql://tempus:tempus@db:5432/tempus
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data:
